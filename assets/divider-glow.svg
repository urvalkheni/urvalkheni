<!-- divider-glow.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" preserveAspectRatio="none">
  <defs>
    <linearGradient id="ng" x1="0" x2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="0.2" stop-color="#b600ff"/>
      <stop offset="0.5" stop-color="#00f6ff"/>
      <stop offset="0.8" stop-color="#b600ff"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <filter id="f1" x="-50%" y="-200%" width="200%" height="400%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#ng)" filter="url(#f1)"/>
</svg>
