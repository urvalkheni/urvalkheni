<!-- hologram-hacku777.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="hg" x1="0" x2="1">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset="0.5" stop-color="#b600ff"/>
      <stop offset="1" stop-color="#00f6ff"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#00f6ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="fBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- subtle background -->
  <rect width="100%" height="100%" rx="8" fill="#0d0d0d"/>

  <!-- hologram ring -->
  <g transform="translate(400,120)">
    <g transform="scale(1)">
      <ellipse rx="220" ry="50" fill="none" stroke="url(#hg)" stroke-width="2" opacity="0.18">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
      </ellipse>

      <g filter="url(#fBlur)">
        <ellipse rx="140" ry="34" fill="url(#gGlow)" opacity="0.9"/>
      </g>

      <!-- holo lines -->
      <g>
        <path d="M-180 -10 L 180 -10" stroke="#00f6ff" stroke-opacity="0.04" stroke-width="2"/>
        <path d="M-160 10 L160 10" stroke="#b600ff" stroke-opacity="0.03" stroke-width="2"/>
      </g>

      <!-- rotating prism -->
      <g>
        <g transform="rotate(0)">
          <polygon points="-80,-40 80,-40 120,0 80,40 -80,40 -120,0" fill="url(#hg)" opacity="0.22">
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="10s" repeatCount="indefinite"/>
          </polygon>
        </g>
      </g>

      <!-- codename text -->
      <text x="0" y="6" text-anchor="middle" font-family="Fira Mono,monospace" font-weight="700" font-size="42" fill="#00f6ff" letter-spacing="6">
        HACKU777
        <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
      </text>

      <!-- subtle scan line -->
      <rect x="-220" y="-66" width="440" height="6" fill="#00f6ff" opacity="0.03">
        <animate attributeName="y" values="-66;66;-66" dur="6s" repeatCount="indefinite"/>
      </rect>

    </g>
  </g>
</svg>
