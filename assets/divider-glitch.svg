<!-- divider-glitch.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="18" viewBox="0 0 1200 18" preserveAspectRatio="none">
  <defs>
    <linearGradient id="gg" x1="0" x2="1">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset="1" stop-color="#b600ff"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0d0d0d"/>

  <g stroke="url(#gg)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M0 9 H120" stroke-dasharray="6 6"/>
    <path d="M0 5 H60 M80 13 H160" stroke-opacity="0.35">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
       values="M0 5 H60 M80 13 H160; M10 5 H70 M90 13 H180; M0 5 H60 M80 13 H160"/>
    </path>
    <path d="M300 9 L360 4 L420 14 L480 2 L540 9" stroke-opacity="0.65"/>
  </g>
</svg>
