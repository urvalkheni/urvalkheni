<!-- glitch-header.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#00f6ff"/>
      <stop offset="0.5" stop-color="#b600ff"/>
      <stop offset="1" stop-color="#00f6ff"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0d0d0d"/>

  <!-- layered glitch text -->
  <g transform="translate(30,78)" font-family="Inter, Arial, monospace" font-weight="800" font-size="64">
    <!-- shadow -->
    <text x="0" y="0" fill="#070707" opacity="0.7">HACKU777</text>

    <!-- red slice -->
    <text x="0" y="0" fill="#ff0040" opacity="0.88" transform="translate(3,-2)">
      HACKU777
      <animate attributeName="x" values="0;2;0" dur="0.6s" repeatCount="indefinite"/>
    </text>

    <!-- cyan slice -->
    <text x="0" y="0" fill="#00f6ff" opacity="0.9" transform="translate(-3,2)">
      HACKU777
      <animate attributeName="x" values="0;-2;0" dur="0.55s" repeatCount="indefinite"/>
    </text>

    <!-- main gradient -->
    <text x="0" y="0" fill="url(#g1)" style="mix-blend-mode:screen">
      HACKU777
      <animate attributeName="opacity" values="1;0.9;1" dur="2.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- glitch bars -->
  <g>
    <rect x="160" y="10" width="100" height="6" fill="#b600ff" opacity="0.06">
      <animate attributeName="x" values="160;420;160" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="60" width="180" height="4" fill="#00f6ff" opacity="0.04">
      <animate attributeName="x" values="40;480;40" dur="6.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
