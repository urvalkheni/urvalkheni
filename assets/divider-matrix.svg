<!-- divider-matrix.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" preserveAspectRatio="none">
  <defs>
    <pattern id="p" x="0" y="0" width="40" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L40 8" stroke="#071018" stroke-width="2"/>
      <path d="M0 4 L40 4" stroke="#0d0d0d" stroke-width="1"/>
    </pattern>
    <linearGradient id="mg" x1="0" x2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="0.25" stop-color="#00f6ff"/>
      <stop offset="0.5" stop-color="#b600ff"/>
      <stop offset="0.75" stop-color="#00f6ff"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#p)"/>
  <rect width="100%" height="100%" fill="url(#mg)" opacity="0.07">
    <animate attributeName="x" from="-200" to="1200" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
