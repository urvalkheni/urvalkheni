<!-- divider-hybrid.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" preserveAspectRatio="none">
  <defs>
    <linearGradient id="hy1" x1="0" x2="1">
      <stop offset="0" stop-color="#b600ff"/>
      <stop offset="0.5" stop-color="#00f6ff"/>
      <stop offset="1" stop-color="#b600ff"/>
    </linearGradient>
  </defs>

  <!-- A: thin neon glow -->
  <rect x="0" y="4" width="300" height="2" fill="url(#hy1)" opacity="0.95"/>
  <rect x="0" y="2" width="300" height="1" fill="#0d0d0d" opacity="0.6"/>

  <!-- B: dotted cyber -->
  <g transform="translate(320,0)" fill="#00f6ff" opacity="0.7">
    <circle cx="0" cy="6" r="1.6"/>
    <circle cx="12" cy="6" r="1.6"/>
    <circle cx="24" cy="6" r="1.6"/>
    <circle cx="36" cy="6" r="1.6"/>
    <circle cx="48" cy="6" r="1.6"/>
  </g>

  <!-- C: matrix block -->
  <rect x="420" y="3" width="240" height="3" fill="#b600ff" opacity="0.25"/>
  <rect x="420" y="8" width="240" height="1" fill="#00f6ff" opacity="0.12"/>

  <!-- D: sharp spike -->
  <path d="M 700 12 L 740 2 L 780 22 L 820 2 L 860 12" stroke="#00f6ff" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- repeat neon -->
  <rect x="900" y="4" width="300" height="2" fill="url(#hy1)" opacity="0.9"/>
</svg>
